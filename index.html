<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【异环】节奏榜编辑器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Noto+Sans+SC:wght@900&display=swap');

        :root {
            --yh-cyan: #00f2ff;
            --yh-magenta: #ff2d55;
        }

        body {
            background-color: #000;
            color: white;
            font-family: 'Noto Sans SC', sans-serif;
            user-select: none;
        }

        /* --- 基础布局 --- */
        .tier-row {
            display: grid;
            grid-template-columns: 80px 1fr;
            gap: 10px;
            margin-bottom: 5px;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 5px 10px;
            border-radius: 4px;
        }

        .tier-label-box {
            display: flex;
            align-items: center;
            justify-content: center;
            border-right: 1px dashed #333;
        }

        .char-card {
            width: 192px;
            height: 155px;
            position: relative;
            cursor: grab;
            transition: all 0.2s;
            flex-shrink: 0;
            background: transparent !important;
        }

        .drag-zone .char-card { width: 120px; height: 97px; }

        .char-avatar-wrapper {
            width: 100%;
            height: 100%;
            background: transparent !important;
            position: relative;
        }

        .char-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
        }

        /* --- 标签样式 --- */
        .custom-tag {
            position: absolute;
            top: 2px;
            right: 6px;
            z-index: 20;
            height: 32px;
            min-width: 60px;
            background: var(--yh-cyan);
            transform: skewX(-15deg); 
            box-shadow: -2px 2px 0 #000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .tag-text {
            transform: skewX(15deg);
            color: #000;
            font-weight: 900;
            font-size: 20px;
            white-space: nowrap;
            text-align: center;
            width: 100%;
            display: block;
            outline: none;
            height: 32px;
            line-height: 28px; 
            margin-top: -2px; 
        }

        /* 缩小版规格 */
        .drag-zone .custom-tag {
            height: 20px;
            min-width: 40px;
            top: 1px;
            right: 4px;
        }
        .drag-zone .tag-text {
            font-size: 13px;
            line-height: 18px;
            height: 20px;
            margin-top: -1px;
        }

        .custom-tag.is-empty { background: transparent !important; box-shadow: none !important; }

        .drag-zone {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            min-height: 97px;
            align-items: center;
        }

        /* --- 响应式补正 --- */
        @media (max-width: 640px) {
            .tier-row { grid-template-columns: 55px 1fr; padding: 5px; }
            .tier-label-box span { font-size: 1.5rem !important; }
            .drag-zone .char-card { width: 75px !important; height: 60px !important; }
            .char-card { width: 90px !important; height: 72px !important; }
            
            .custom-tag {
                height: 16px !important;
                min-width: 32px !important;
                top: 1px !important;
                right: 3px !important;
            }
            .tag-text {
                font-size: 10px !important;
                line-height: 14px !important;
                height: 16px !important;
                margin-top: -1px !important;
            }
            .drag-zone .custom-tag { height: 14px !important; }
            .drag-zone .tag-text { line-height: 12px !important; height: 14px !important; font-size: 9px !important;}
            .mobile-stack { flex-direction: column; align-items: flex-start !important; gap: 0.5rem !important; }
        }

        [contenteditable="true"]:focus { outline: none; background: rgba(0, 242, 255, 0.1); border-radius: 2px; }
    </style>
</head>
<body class="p-2 md:p-4">

    <input type="file" id="manual-upload" accept="image/*" multiple class="hidden" onchange="handleManualUpload(this)">

    <div class="max-w-[1400px] mx-auto bg-[#0a0a0a] p-4 md:p-6 shadow-2xl border border-gray-900">
        
        <!-- 版头布局 -->
        <div class="mb-4 pb-4 border-b border-gray-800">
            <h1 contenteditable="true" class="text-3xl md:text-5xl font-black italic text-white uppercase tracking-tighter leading-none mb-3">
                【异环】节奏榜
            </h1>
            <div class="flex flex-wrap items-center gap-x-8 gap-y-2 text-xs md:text-sm mobile-stack">
                <div class="flex items-center gap-1">
                    <span class="text-gray-500 italic">作者：</span>
                    <span contenteditable="true" class="border-b border-gray-700 pb-px">点击修改</span>
                </div>
                <div class="flex items-center gap-1 font-mono text-gray-400">
                    <span class="text-gray-600">更新时间：</span>
                    <span id="current-date" contenteditable="true">2026.05.08</span>
                </div>
                <div class="flex flex-wrap items-center gap-1">
                    <span class="text-gray-500 italic shrink-0">异环wiki攻略站：</span>
                    <a href="https://www.gamekee.com/yh/?source=ai" target="_blank" class="text-[#00f2ff] hover:underline break-all">https://www.gamekee.com/yh/</a>
                    <span class="ml-0 md:ml-2 text-gray-300 italic text-[10px] md:text-xs">tip：标签≤5个字也可删除，加速环境下页面加载更快</span>
                </div>
            </div>
        </div>

        <!-- 梯度列表 -->
        <div id="tier-rows-container">
            <div class="tier-row">
                <div class="tier-label-box"><span contenteditable="true" class="text-4xl font-black italic text-[#ff2d55] font-['Orbitron']">T0</span></div>
                <div class="drag-zone"></div>
            </div>
            <div class="tier-row">
                <div class="tier-label-box"><span contenteditable="true" class="text-3xl font-black italic text-[#00f2ff] font-['Orbitron']">T0.5</span></div>
                <div class="drag-zone"></div>
            </div>
            <div class="tier-row">
                <div class="tier-label-box"><span contenteditable="true" class="text-2xl font-black italic text-white font-['Orbitron']">T1</span></div>
                <div class="drag-zone"></div>
            </div>
            <div class="tier-row">
                <div class="tier-label-box"><span contenteditable="true" class="text-2xl font-black italic text-blue-500 font-['Orbitron']">T2</span></div>
                <div class="drag-zone"></div>
            </div>
        </div>
    </div>

    <!-- 角色库 -->
    <div class="max-w-[1400px] mx-auto mt-6 p-4 bg-[#050505] border border-gray-800">
        <div class="mb-3 flex justify-between items-center">
            <div class="text-[10px] font-bold text-gray-600 tracking-widest uppercase flex items-center gap-2">
                <div class="w-1.5 h-3 bg-cyan-800"></div> 角色池 / CHARACTER POOL
            </div>
            <button onclick="document.getElementById('manual-upload').click()" class="bg-gray-800 hover:bg-gray-700 text-cyan-500 px-4 py-1 text-[10px] md:text-[11px] border border-cyan-900 transition-all font-bold">
                + 手动上传
            </button>
        </div>
        <div id="character-pool" class="drag-zone min-h-[120px] bg-[#0a0a0a] p-2 border border-dashed border-gray-800"></div>
    </div>

    <script>
        let isComposing = false;

        window.onload = function() {
            const pool = document.getElementById('character-pool');
            for (let i = 1; i <= 100; i++) {
                const img = new Image();
                img.src = `img/${i}.png`;
                img.onload = function() { createCard(this.src); };
            }
            const d = new Date();
            document.getElementById('current-date').innerText = `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
        };

        function handleManualUpload(input) {
            if (input.files) {
                Array.from(input.files).forEach(file => {
                    const reader = new FileReader();
                    reader.onload = e => createCard(e.target.result);
                    reader.readAsDataURL(file);
                });
            }
        }

        function createCard(imgSrc) {
            const pool = document.getElementById('character-pool');
            const card = document.createElement('div');
            card.className = 'char-card';
            
            const tagContainer = document.createElement('div');
            tagContainer.className = 'custom-tag';
            
            const tagText = document.createElement('div');
            tagText.className = 'tag-text';
            tagText.contentEditable = true;
            tagText.innerText = '标签';
            
            tagText.addEventListener('compositionstart', () => { isComposing = true; });
            tagText.addEventListener('compositionend', (e) => { isComposing = false; handleTagLogic(e.target); });
            tagText.addEventListener('input', (e) => { if (!isComposing) handleTagLogic(e.target); });
            tagText.addEventListener('blur', (e) => handleTagLogic(e.target));

            tagContainer.appendChild(tagText);

            const avatarWrap = document.createElement('div');
            avatarWrap.className = 'char-avatar-wrapper';
            avatarWrap.innerHTML = `<img src="${imgSrc}" class="char-img">`;

            card.appendChild(tagContainer);
            card.appendChild(avatarWrap);
            
            card.oncontextmenu = e => { e.preventDefault(); if(confirm('确认移除？')) card.remove(); };
            pool.appendChild(card);
        }

        function handleTagLogic(el) {
            const container = el.parentElement;
            const text = el.innerText.trim();
            
            if (text === "") container.classList.add('is-empty');
            else container.classList.remove('is-empty');

            if (el.innerText.length > 5) {
                el.innerText = el.innerText.substring(0, 5);
                const range = document.createRange();
                const sel = window.getSelection();
                if (el.childNodes.length > 0) {
                    const lastNode = el.childNodes[el.childNodes.length - 1];
                    range.setStart(lastNode, lastNode.length);
                    range.collapse(true);
                    sel.removeAllRanges();
                    sel.addRange(range);
                }
            }
        }

        document.querySelectorAll('.drag-zone').forEach(zone => {
            new Sortable(zone, { 
                group: 'shared', 
                animation: 150, 
                ghostClass: 'opacity-10', 
                forceFallback: true,
                onEnd: () => {
                   document.querySelectorAll('.tag-text').forEach(t => handleTagLogic(t));
                }
            });
        });
    </script>
</body>
</html>
