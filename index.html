<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【异环】节奏榜编辑器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Noto+Sans+SC:wght@900&display=swap');

        :root {
            --yh-cyan: #00f2ff;
            --yh-magenta: #ff2d55;
        }

        body {
            background-color: #000;
            color: white;
            font-family: 'Noto Sans SC', sans-serif;
            user-select: none;
        }

        /* 梯度行高度管控 */
        .tier-row {
            display: grid;
            grid-template-columns: 80px 1fr;
            gap: 10px;
            margin-bottom: 5px;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 5px 10px;
            border-radius: 4px;
        }

        .tier-label-box {
            display: flex;
            align-items: center;
            justify-content: center;
            border-right: 1px dashed #333;
        }

        /* 角色卡片基础尺寸 (角色库用) */
        .char-card {
            width: 192px;
            height: 155px;
            position: relative;
            cursor: grab;
            transition: all 0.2s;
            flex-shrink: 0;
            background: transparent !important;
        }

        /* 梯度行内等比缩小 */
        .drag-zone .char-card {
            width: 120px;
            height: 97px;
        }

        .char-avatar-wrapper {
            width: 100%;
            height: 100%;
            background: transparent !important;
            position: relative;
        }

        .char-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
        }

        /* 标签样式：大尺寸 + 自动隐藏逻辑 */
        .custom-tag {
            position: absolute;
            top: 2px;
            right: 2px;
            color: #000;
            font-weight: 900;
            z-index: 10;
            transition: all 0.2s ease;
            font-size: 22px; 
            padding: 2px 8px;
            background: var(--yh-cyan);
            box-shadow: -2px 2px 0 #000;
            clip-path: polygon(10% 0, 100% 0, 100% 80%, 90% 100%, 0 100%, 0 20%);
            min-width: 10px;
            text-align: center;
            line-height: 1.1;
        }

        /* 缩小版标签 */
        .drag-zone .custom-tag {
            font-size: 16px;
            padding: 1px 6px;
        }

        /* 空标签隐藏UI */
        .custom-tag.is-empty {
            background: transparent !important;
            box-shadow: none !important;
            clip-path: none !important;
        }

        .drag-zone {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            min-height: 97px;
            align-items: center;
        }

        [contenteditable="true"]:focus {
            outline: none;
            background: rgba(0, 242, 255, 0.2);
            border-radius: 2px;
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    </style>
</head>
<body class="p-2 md:p-4">

    <!-- 隐藏的手动上传控件 -->
    <input type="file" id="manual-upload" accept="image/*" multiple class="hidden" onchange="handleManualUpload(this)">

    <!-- 图片抓取区域 (保存图片时仅包含此处内容) -->
    <div id="capture-area" class="max-w-[1400px] mx-auto bg-[#0a0a0a] p-6 shadow-2xl border border-gray-900">
        
        <!-- 版头布局 -->
        <div class="mb-4 pb-4 border-b border-gray-800">
            <!-- 修改点1：大标题 -->
            <h1 contenteditable="true" class="text-5xl font-black italic text-white uppercase tracking-tighter leading-none mb-2">
                【异环】节奏榜
            </h1>
            <div class="flex flex-wrap items-center gap-x-8 gap-y-2 text-sm">
                <div class="flex items-center gap-1">
                    <span class="text-gray-500 italic">作者：</span>
                    <span contenteditable="true" class="border-b border-gray-700 pb-px">点击修改</span>
                </div>
                <div class="flex items-center gap-1 font-mono text-gray-400">
                    <span class="text-gray-600">更新时间：</span>
                    <span id="current-date" contenteditable="true">2026.05.08</span>
                </div>
                <div class="flex items-center gap-1">
                    <span class="text-gray-500 italic">异环wiki攻略站：</span>
                    <a href="https://www.gamekee.com/yh/?source=ai" target="_blank" class="text-[#00f2ff] hover:underline">https://www.gamekee.com/yh/</a>
                    <!-- 修改点2：Tip文案及颜色 -->
                    <span class="ml-2 text-gray-300 italic text-xs">tip：标签≤5个字也可删除，加速环境下页面加载更快</span>
                </div>
            </div>
        </div>

        <!-- 梯度列表 -->
        <div id="tier-rows-container">
            <div class="tier-row">
                <div class="tier-label-box"><span contenteditable="true" class="text-4xl font-black italic text-[#ff2d55] font-['Orbitron']">T0</span></div>
                <div class="drag-zone"></div>
            </div>
            <div class="tier-row">
                <div class="tier-label-box"><span contenteditable="true" class="text-3xl font-black italic text-[#00f2ff] font-['Orbitron']">T0.5</span></div>
                <div class="drag-zone"></div>
            </div>
            <div class="tier-row">
                <div class="tier-label-box"><span contenteditable="true" class="text-2xl font-black italic text-white font-['Orbitron']">T1</span></div>
                <div class="drag-zone"></div>
            </div>
            <div class="tier-row">
                <div class="tier-label-box"><span contenteditable="true" class="text-2xl font-black italic text-blue-500 font-['Orbitron']">T2</span></div>
                <div class="drag-zone"></div>
            </div>
        </div>
    </div>

    <!-- 角色库区域 (不在图片保存范围内) -->
    <div class="max-w-[1400px] mx-auto mt-6 p-4 bg-[#050505] border border-gray-800">
        <div class="mb-3 flex justify-between items-center">
            <div class="text-[10px] font-bold text-gray-600 tracking-widest uppercase flex items-center gap-2">
                <div class="w-1.5 h-3 bg-cyan-800"></div> 角色池 / CHARACTER POOL
            </div>
            <button onclick="document.getElementById('manual-upload').click()" class="bg-gray-800 hover:bg-gray-700 text-cyan-500 px-4 py-1 text-[11px] border border-cyan-900 transition-all font-bold">
                + 手动上传新头像
            </button>
        </div>
        <div id="character-pool" class="drag-zone min-h-[160px] bg-[#0a0a0a] p-2 border border-dashed border-gray-800"></div>
    </div>

    <!-- 保存按钮 -->
    <div class="fixed bottom-6 right-6">
        <button onclick="exportImage()" class="px-8 py-3 bg-[#00f2ff] text-black font-black italic text-lg shadow-[4px_4px_0_#fff] hover:shadow-none hover:translate-x-1 hover:translate-y-1 transition-all">
            保存图片
        </button>
    </div>

    <script>
        let isComposing = false; // IME锁

        window.onload = function() {
            const pool = document.getElementById('character-pool');
            // 自动加载 img 文件夹
            for (let i = 1; i <= 100; i++) {
                const img = new Image();
                img.src = `img/${i}.png`;
                img.onload = function() { createCard(this.src); };
            }
            const d = new Date();
            document.getElementById('current-date').innerText = `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
        };

        // 手动上传头像函数
        function handleManualUpload(input) {
            if (input.files) {
                Array.from(input.files).forEach(file => {
                    const reader = new FileReader();
                    reader.onload = e => createCard(e.target.result);
                    reader.readAsDataURL(file);
                });
            }
        }

        // 创建角色卡片
        function createCard(imgSrc) {
            const pool = document.getElementById('character-pool');
            const card = document.createElement('div');
            card.className = 'char-card';
            
            const tag = document.createElement('div');
            tag.className = 'custom-tag';
            tag.contentEditable = true;
            tag.innerText = '标签';
            
            // 绑定标签输入逻辑
            tag.addEventListener('compositionstart', () => { isComposing = true; });
            tag.addEventListener('compositionend', (e) => { 
                isComposing = false; 
                handleTagLogic(e.target); 
            });
            tag.addEventListener('input', (e) => { 
                if (!isComposing) handleTagLogic(e.target); 
            });
            tag.addEventListener('blur', (e) => handleTagLogic(e.target));

            const avatarWrap = document.createElement('div');
            avatarWrap.className = 'char-avatar-wrapper';
            avatarWrap.innerHTML = `<img src="${imgSrc}" class="char-img">`;

            card.appendChild(tag);
            card.appendChild(avatarWrap);
            
            card.oncontextmenu = e => { e.preventDefault(); if(confirm('确认从编辑器中移除？')) card.remove(); };
            pool.appendChild(card);
        }

        // 处理标签UI和限制
        function handleTagLogic(el) {
            const text = el.innerText.trim();

            // 1. 自动显示/隐藏背景UI
            if (text === "") {
                el.classList.add('is-empty');
            } else {
                el.classList.remove('is-empty');
            }

            // 2. 限制5个字符
            if (el.innerText.length > 5) {
                el.innerText = el.innerText.substring(0, 5);
                // 修正光标到最后
                const range = document.createRange();
                const sel = window.getSelection();
                if (el.childNodes.length > 0) {
                    const lastNode = el.childNodes[el.childNodes.length - 1];
                    range.setStart(lastNode, lastNode.length);
                    range.collapse(true);
                    sel.removeAllRanges();
                    sel.addRange(range);
                }
            }
        }

        document.querySelectorAll('.drag-zone').forEach(zone => {
            new Sortable(zone, { 
                group: 'shared', 
                animation: 150, 
                ghostClass: 'opacity-10',
                forceFallback: true
            });
        });

        async function exportImage() {
            const area = document.getElementById('capture-area');
            const canvas = await html2canvas(area, { 
                backgroundColor: '#0a0a0a', 
                scale: 2, 
                useCORS: true,
                logging: false
            });
            const link = document.createElement('a');
            link.download = `异环节奏榜_${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
